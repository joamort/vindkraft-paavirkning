name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-oppsett
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: php -l på all PHP
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find . -name '*.php' -not -path './node_modules/*' -print0)
          exit $fail

      - name: node --check på all JS
        run: |
          fail=0
          for f in $(find js tools -type f \( -name '*.js' -o -name '*.mjs' \)); do
            node --check "$f" || fail=1
          done
          exit $fail

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bygg Docker-biletet
        run: docker build -t vindkraft-ci .

      - name: Røyktest — server, header og tilgangskontroll
        run: |
          set -x
          # VIND_SKIP_CACHE_BUILD: routing/header-testen treng ikkje turbindata,
          # og NVE-hentinga er treg/upåliteleg frå runneren.
          docker run -d --name vind -e VIND_SKIP_CACHE_BUILD=1 -p 8011:8011 vindkraft-ci

          ok=
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:8011/; then ok=1; break; fi
            sleep 2
          done
          docker logs vind || true
          if [ -z "$ok" ]; then echo "::error::serveren svara aldri"; exit 1; fi

          fail=0
          check() { # <forventa> <url>
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8011$2")
            [ "$got" = "$1" ] || { echo "::error::$2 gav $got, venta $1"; fail=1; }
          }

          curl -si http://localhost:8011/ > /tmp/root.txt
          head -1 /tmp/root.txt | grep -q '200' || { echo "::error::/ ikkje 200"; fail=1; }
          grep -qi 'content-security-policy' /tmp/root.txt || { echo "::error::manglar CSP"; fail=1; }
          grep -qi "connect-src 'self'" /tmp/root.txt || { echo "::error::CSP connect-src feil"; fail=1; }

          check 200 /css/styles.css
          check 200 /js/app.js
          check 403 /tools/verify_model.mjs
          check 403 /scripts/dev.sh
          check 403 /logs/error.log
          check 403 /cache/elevation/.gitkeep
          check 403 /cache/layouts.json
          check 405 /backend/api/refresh_turbines.php

          # adressesok.php: for kort spørjing → tom trefliste, ingen Kartverket-kall
          as=$(curl -s "http://localhost:8011/backend/api/adressesok.php?q=ab")
          case "$as" in
            *'"ok":true'*'"treff":[]'*) echo "adressesok: ok ✓" ;;
            *) echo "::error::adressesok uventa: ${as:0:120}"; fail=1 ;;
          esac

          # version_check.php: utan version.json (som i biletet) skal han svare
          # reint JSON med naavaerande:null, utan å kontakte GitHub.
          vc=$(curl -s http://localhost:8011/backend/api/version_check.php)
          case "$vc" in
            *'"ok":true'*'"naavaerande":null'*) echo "version_check: ok ✓" ;;
            *) echo "::error::version_check uventa svar: ${vc:0:160}"; fail=1 ;;
          esac

          # PHP-svar må vere reint JSON — ingen deprecation/warning-HTML framfor
          # (display_errors må vere Off i den medfølgjande php.ini).
          body=$(curl -s http://localhost:8011/backend/api/turbines.php)
          case "$body" in
            '{'*) echo "turbines.php: reint JSON ✓" ;;
            *) echo "::error::turbines.php lek ikkje-JSON: ${body:0:120}"; fail=1 ;;
          esac
          if curl -si http://localhost:8011/ | grep -qi '^x-powered-by:'; then
            echo "::error::X-Powered-By-header ikkje skjult (expose_php)"; fail=1
          fi

          docker rm -f vind
          exit $fail
