name: Release

# Byggjer sjølvstendige nedlastbare utgåver (FrankenPHP + appen) for Linux,
# macOS og Windows, og heng dei på GitHub-releasen.
#
# Utløysar: push av ein tag som byrjar på «v», t.d.
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Kan pinnast til ein konkret versjon (t.d. «1.12.7») for reproduserbare
  # byggjer. «latest» følgjer nyaste FrankenPHP-utgåve.
  FRANKENPHP_VERSION: latest

jobs:
  # Byggjer turbin-cachen éin gong og deler han med alle pakke-jobbane, i
  # staden for at kvar av dei fire hentar det same frå NVE.
  turbincache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, dom, simplexml, mbstring
          coverage: none
      - name: Bygg turbin-cache
        run: |
          php cron/fetch_turbines.php
          ls -la cache/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: turbincache
          path: |
            cache/turbines.json
            cache/areas.json
            cache/meta.json
            cache/layouts.json
          retention-days: 1

  build:
    needs: turbincache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            asset: frankenphp-linux-x86_64
            kind: static
            archive: tar.gz
          - name: linux-arm64
            asset: frankenphp-linux-aarch64
            kind: static
            archive: tar.gz
          - name: mac-arm64
            asset: frankenphp-mac-arm64
            kind: static
            archive: tar.gz
          - name: windows-x86_64
            asset: frankenphp-windows-x86_64.zip
            kind: windows-zip
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Hent den ferdigbygde turbin-cachen
        uses: actions/download-artifact@v4
        with:
          name: turbincache
          path: cache

      - name: Last ned FrankenPHP (${{ matrix.name }})
        run: |
          set -eux
          if [ "${FRANKENPHP_VERSION}" = "latest" ]; then
            base="https://github.com/php/frankenphp/releases/latest/download"
          else
            base="https://github.com/php/frankenphp/releases/download/v${FRANKENPHP_VERSION}"
          fi
          curl -fSL --retry 3 -o fp-download "${base}/${{ matrix.asset }}"

      - name: Sett saman pakka
        run: |
          set -eux
          dir="vindkraft-paavirkning-${{ matrix.name }}"
          mkdir -p "$dir"

          # --- FrankenPHP ---
          case "${{ matrix.kind }}" in
            static)
              mv fp-download "$dir/frankenphp"
              chmod +x "$dir/frankenphp"
              ;;
            windows-zip)
              # frankenphp.exe + berre DLL-ane på toppnivå (curl, mbstring, dom,
              # simplexml er kompilerte inn — ext/, dev/, lib/, extras/ trengst
              # ikkje).
              mkdir fpwin && unzip -q fp-download -d fpwin \
                -x 'ext/*' 'dev/*' 'lib/*' 'extras/*'
              cp fpwin/frankenphp.exe "$dir/"
              cp fpwin/*.dll "$dir/"
              ;;
          esac

          # --- Appen ---
          cp -r index.html favicon.ico css js assets backend cron Caddyfile LICENSE "$dir/"
          cp scripts/dist/php.ini "$dir/"
          mkdir -p "$dir/cache/elevation" "$dir/cache/ratelimit" "$dir/logs"
          touch "$dir/cache/elevation/.gitkeep" "$dir/cache/ratelimit/.gitkeep"

          # Ferdigbygd turbin-cache — fyrste start treng då ikkje henta frå NVE.
          # (elevation/-cachen er punktspesifikk og vert IKKJE pakka med.)
          cp cache/turbines.json cache/areas.json cache/meta.json cache/layouts.json "$dir/cache/"

          # Utgåvestempel — version_check.php samanliknar dette mot GitHub.
          # Finst berre i nedlastbare utgåver; utan fila er versjonssjekken av.
          printf '{"versjon":"%s","bygd":"%s"}\n' \
            "${{ github.ref_name }}" "$(date -u +%Y-%m-%d)" > "$dir/version.json"

          # --- Startarar ---
          cp scripts/dist/LES-MEG.txt "$dir/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp scripts/dist/start.bat "$dir/"
            zip -qr "${dir}.zip" "$dir"
          else
            cp scripts/dist/start.sh "$dir/start.sh"
            cp scripts/dist/start.sh "$dir/start.command"  # dobbeltklikkbar i macOS Finder
            chmod +x "$dir/start.sh" "$dir/start.command"
            tar -czf "${dir}.tar.gz" "$dir"
          fi
          ls -la vindkraft-paavirkning-*.*

      - name: Heng på releasen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vindkraft-paavirkning-${{ matrix.name }}.tar.gz
            vindkraft-paavirkning-${{ matrix.name }}.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
