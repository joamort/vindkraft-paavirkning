; PHP-innstillingar for den medfølgjande FrankenPHP-serveren.
;
; Speglar ein vanleg produksjonskonfig — det same som Apache-hostinga appen
; elles køyrer på. Utan dette skriv PHP sine varsel (m.a. PHP 8.5 sitt
; deprecation-varsel for $http_response_header) seg rett inn i JSON-svara,
; sidan FrankenPHP har display_errors = On som standard.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
expose_php = Off

; Rikeleg for dei parallelle batch-analysekalla mot Kartverket.
max_execution_time = 120
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 2M
